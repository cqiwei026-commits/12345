<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>神明請上工！3D</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#78b9d4;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#fff}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.hud{position:fixed;z-index:5;top:0;left:0;right:0;min-height:68px;background:#18202ddd;border-bottom:3px solid #c79b3d;display:flex;align-items:center;gap:7px;padding:7px}.title{font-size:clamp(17px,2.3vw,28px);font-weight:900;color:#ffd75c;white-space:nowrap}.res{background:#303943;border:2px solid #66727d;border-radius:11px;padding:8px 10px;font-weight:800;white-space:nowrap}.menu{margin-left:auto;display:flex;gap:6px}.menu button,.panel button{border:0;border-radius:9px;padding:9px 11px;background:#a94a35;color:#fff;font-weight:900}.panel{position:fixed;z-index:10;right:9px;top:79px;width:min(370px,48vw);max-height:78vh;overflow:auto;background:#202832ee;border:3px solid #c79b3d;border-radius:15px;padding:13px;display:none}.panel h2{margin:0 0 8px;color:#ffd75c}.card{background:#313b46;border-radius:11px;padding:9px;margin:7px 0}.godface{font-size:42px;vertical-align:middle}.toast{position:fixed;z-index:20;left:50%;bottom:9%;transform:translateX(-50%);background:#241d18ee;border:3px solid #e1b94e;border-radius:13px;padding:12px 20px;font-weight:900;font-size:18px;display:none;text-align:center}.hint{position:fixed;z-index:4;left:9px;bottom:9px;background:#202832cc;border-radius:10px;padding:7px 10px;font-size:13px}</style></head><body><canvas id="c"></canvas><div class="hud"><div class="title">🏮 神明請上工！</div><div class="res">🪙 <span id="money">500</span></div><div class="res">✨ <span id="faith">100</span></div><div class="res">🙏 <span id="believers">12</span></div><div class="menu"><button onclick="panel('god')">神明</button><button onclick="panel('build')">擴建</button><button onclick="panel('formation')">藝陣</button></div></div><div id="p" class="panel"></div><div id="t" class="toast"></div><div class="hint">👆 拖曳看宮廟｜滑輪縮放｜點擊神明祈福</div><script>const S={money:500,faith:100,believers:12,front:false,main:false,back:false,tower:false,god:'土地公'};const gods=[['土地公','守護地方','🧓'],['媽祖','平安','👩‍🦳'],['文昌帝君','學業','📚'],['財神爺','財運','💰'],['關聖帝君','事業','🧔'],['月老','姻緣','💗'],['城隍爺','秩序','🧔'],['三太子','青春','🧒'],['觀世音菩薩','慈悲安定','🙏']];try{Object.assign(S,JSON.parse(localStorage.getItem('shenming3d')||'{}'))}catch(e){}function save(){localStorage.setItem('shenming3d',JSON.stringify(S))}function render(){money.textContent=Math.floor(S.money);faith.textContent=Math.floor(S.faith);believers.textContent=Math.floor(S.believers)}function toast(x){t.innerHTML=x;t.style.display='block';clearTimeout(window.tm);tm=setTimeout(()=>t.style.display='none',1800)}function panel(type){p.style.display='block';if(type==='god')p.innerHTML='<h2>🙏 Q版神明安座</h2><div class="card">目前主神：<b>'+S.god+'</b><br>圓潤Q版、童趣比例的神明模型。</div>'+gods.map((g,i)=>'<div class="card"><span class="godface">'+g[2]+'</span> <b>'+g[0]+'</b>｜'+g[1]+'<br><button onclick="worship(\''+g[0]+'\')">擲筊迎請 '+(80+i*30)+'🪙</button></div>').join('')+'<button onclick="p.style.display=\'none\'">關閉</button>';if(type==='build')p.innerHTML='<h2>🏯 宮廟三進擴建</h2><div class="card">前殿：'+(S.front?'完成':'未完成')+'<br>正殿：'+(S.main?'完成':'未完成')+'<br>後殿：'+(S.back?'完成':'未完成')+'<br>鐘鼓樓：'+(S.tower?'完成':'未完成')+'</div><button onclick="build(\'front\',800)">三川殿 800🪙</button><br><br><button onclick="build(\'main\',1500)">正殿 1500🪙</button><br><br><button onclick="build(\'back\',2400)">後殿 2400🪙</button><br><br><button onclick="build(\'tower\',3600)">鐘樓・鼓樓 3600🪙</button><div class="card">古建細節：燕尾脊、蟠龍石柱、青斗石獅、手工剪黏。</div><button onclick="p.style.display=\'none\'">關閉</button>';if(type==='formation')p.innerHTML='<h2>🥁 百萬藝陣</h2><div class="card">八家將 👹｜官將首 🎭｜電音三太子 🕺｜舞龍舞獅 🐲</div><button onclick="parade()">🌈 霓虹夜巡 -50✨</button><br><br><button onclick="challenge()">🥁 同行踢館</button><br><br><button onclick="p.style.display=\'none\'">關閉</button>'}function worship(g){let i=gods.findIndex(x=>x[0]===g),cost=80+i*30;if(S.money<cost)return toast('香油錢不足！');S.money-=cost;S.god=g;if(Math.random()<.7){S.money+=220;S.faith+=90;S.believers+=2;toast('🧧 '+g+' 顯靈！ +220 香油錢')}else toast('🌓 再擲一次筊吧！');render();save();panel('god')}function build(k,c){if(S[k])return toast('已完成！');if(S.money<c)return toast('香油錢不足！');S.money-=c;S[k]=true;S.faith+=40;render();save();toast('🏯 擴建完成！');panel('build')}function parade(){if(S.faith<50)return toast('信仰之力不足！');S.faith-=50;S.money+=650;S.believers+=10;render();save();toast('🌈 霓虹夜巡完成！')}function challenge(){if(Math.random()<.6){S.money+=500;S.faith+=70;toast('🥁 鬥陣圓滿！')}else{S.money=Math.max(0,S.money-180);toast('陣勢受挫，-180🪙')}render();save()}const gl=c.getContext('webgl',{antialias:true});let yaw=.35,pitch=.62,dist=15,lastX=0,lastY=0,drag=false;function sh(type,src){let x=gl.createShader(type);gl.shaderSource(x,src);gl.compileShader(x);return x}const vs=sh(gl.VERTEX_SHADER,'attribute vec3 p;uniform mat4 mvp;varying vec3 v;void main(){v=p;gl_Position=mvp*vec4(p,1.0);}'),fs=sh(gl.FRAGMENT_SHADER,'precision mediump float;uniform vec3 col;varying vec3 v;void main(){float l=.68+.32*clamp(v.y+.5,0.,1.);gl_FragColor=vec4(col*l,1.);}');const pr=gl.createProgram();gl.attachShader(pr,vs);gl.attachShader(pr,fs);gl.linkProgram(pr);const lp=gl.getAttribLocation(pr,'p'),lm=gl.getUniformLocation(pr,'mvp'),lc=gl.getUniformLocation(pr,'col'),buf=gl.createBuffer();function cube(x,y,z,w,h,d,col){let X=w/2,Y=h/2,Z=d/2,a=[x-X,y-Y,z-Z,x+X,y-Y,z-Z,x+X,y+Y,z-Z,x-X,y+Y,z-Z,x-X,y-Y,z+Z,x+X,y-Y,z+Z,x+X,y+Y,z+Z,x-X,y+Y,z+Z],ix=[0,1,2,0,2,3,4,6,5,4,7,6,0,4,5,0,5,1,2,6,7,2,7,3,0,3,7,0,7,4,1,5,6,1,6,2],o=[];for(let i of ix)o.push(...a.slice(i*3,i*3+3));gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(o),gl.DYNAMIC_DRAW);gl.vertexAttribPointer(lp,3,gl.FLOAT,false,0,0);gl.enableVertexAttribArray(lp);gl.uniform3fv(lc,col);gl.drawArrays(gl.TRIANGLES,0,o.length/3)}function roof(x,y,z,w,d,col){cube(x,y,z,w,.28,d,col);cube(x,y+.23,z,w*.78,.18,d*.82,col)}function deity(){let c1=[.93,.72,.46],red=[.78,.13,.1],gold=[1,.72,.16],skin=[1,.67,.47],dark=[.12,.08,.06];cube(0,1.05,-1.7,.95,1.25,.62,red);cube(0,1.92,-1.7,.8,.72,.62,skin);cube(0,2.48,-1.7,.9,.22,.72,gold);cube(-.48,1.65,-1.7,.18,.72,.25,red);cube(.48,1.65,-1.7,.18,.72,.25,red);cube(-.22,1.98,-2.03,.1,.1,.06,dark);cube(.22,1.98,-2.03,.1,.1,.06,dark);cube(0,1.82,-2.03,.18,.08,.06,red);cube(-.18,2.32,-1.7,.12,.4,.12,dark);cube(.18,2.32,-1.7,.12,.4,.12,dark);cube(0,2.6,-1.7,.35,.18,.4,gold)}function tree(x,z){cube(x,.7,z,.35,1.8,.35,[.3,.2,.12]);cube(x,1.75,z,1.9,1.5,1.7,[.16,.45,.23]);cube(x-.55,2.05,z,1.2,1.0,1.2,[.2,.52,.27])}function mat(){let a=c.width/c.height, sx=1.25/a,sy=1.25,sz=-.065, m=new Float32Array(16);m[0]=sx;m[5]=sy;m[10]=sz;m[12]=Math.sin(yaw)*.7;m[13]=-.22+Math.sin(pitch)*.15;m[14]=-1.2; m[15]=1;return m}function draw(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;gl.viewport(0,0,c.width,c.height);gl.clearColor(.35,.63,.73,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.enable(gl.DEPTH_TEST);gl.useProgram(pr);gl.uniformMatrix4fv(lm,false,mat());cube(0,-.3,0,18,.55,14,[.58,.49,.34]);cube(0,.02,0,7,.18,10,[.66,.61,.51]);cube(0,.9,0,5.8,1.9,3.3,[.68,.17,.12]);roof(0,2.05,0,7,4.2,[.23,.14,.1]);if(S.front){cube(0,1.45,-2.65,6.5,1.35,2,[.72,.19,.13]);roof(0,2.25,-2.65,7.2,2.5,[.25,.14,.1])}if(S.main){cube(0,1.7,0,6.2,2.2,3.8,[.72,.19,.13]);roof(0,2.9,0,7.2,4.5,[.24,.14,.1])}if(S.back){cube(0,1.5,2.7,5.7,1.8,2,[.72,.19,.13]);roof(0,2.55,2.7,6.6,2.5,[.25,.14,.1])}if(S.tower){cube(-4,1,-1,1.7,3,1.7,[.44,.28,.16]);cube(4,1,-1,1.7,3,1.7,[.44,.28,.16]);roof(-4,2.7,-1,2,2,[.25,.14,.1]);roof(4,2.7,-1,2,2,[.25,.14,.1])}cube(0,1.0,-1.9,1.2,1.5,.45,[.12,.08,.06]);deity();tree(-4.8,3.8);tree(4.8,3.8);tree(-6,0);tree(6,0);requestAnimationFrame(draw)}c.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY});c.addEventListener('pointerup',()=>drag=false);c.addEventListener('pointermove',e=>{if(drag){yaw+=(e.clientX-lastX)*.008;pitch=Math.max(.15,Math.min(1.2,pitch+(e.clientY-lastY)*.006));lastX=e.clientX;lastY=e.clientY}});c.addEventListener('wheel',e=>{dist=Math.max(8,Math.min(24,dist+e.deltaY*.01))});c.addEventListener('click',e=>{if(!drag){S.money+=35;S.faith+=10;S.believers++;render();save();toast('✨ 信徒祈福！ +35🪙 +10✨')}});render();draw();</script></body></html>
