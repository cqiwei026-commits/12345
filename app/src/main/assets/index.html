<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>神明請上工！3D</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10151b;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#fff}#game{position:fixed;inset:0;background:#79b9d4}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.hud{position:absolute;z-index:5;top:0;left:0;right:0;min-height:68px;background:#18202bdd;border-bottom:3px solid #c79b3d;display:flex;align-items:center;gap:8px;padding:8px}.title{font-size:clamp(17px,2.3vw,28px);font-weight:900;color:#ffd75c;white-space:nowrap}.res{background:#303943;border:2px solid #66727d;border-radius:11px;padding:8px 10px;font-weight:800;white-space:nowrap}.menu{margin-left:auto;display:flex;gap:6px}.menu button,.panel button{border:0;border-radius:9px;padding:9px 11px;background:#a94a35;color:#fff;font-weight:900}.panel{position:absolute;z-index:10;right:10px;top:80px;width:min(370px,48vw);max-height:76vh;overflow:auto;background:#202832ee;border:3px solid #c79b3d;border-radius:15px;padding:13px;display:none}.panel h2{margin:0 0 8px;color:#ffd75c}.card{background:#313b46;border-radius:11px;padding:9px;margin:7px 0}.toast{position:absolute;z-index:20;left:50%;bottom:10%;transform:translateX(-50%);background:#241d18ee;border:3px solid #e1b94e;border-radius:13px;padding:12px 20px;font-weight:900;font-size:18px;display:none;text-align:center}.hint{position:absolute;z-index:4;left:10px;bottom:10px;background:#202832cc;border-radius:10px;padding:7px 10px;font-size:13px}</style></head><body><div id="game"><canvas id="c"></canvas><div class="hud"><div class="title">🏮 神明請上工！ 3D</div><div class="res">🪙 <span id="money">500</span></div><div class="res">✨ <span id="faith">100</span></div><div class="res">🙏 <span id="believers">12</span></div><div class="menu"><button onclick="panel('god')">神明</button><button onclick="panel('build')">擴建</button><button onclick="panel('formation')">藝陣</button></div></div><div id="p" class="panel"></div><div id="t" class="toast"></div><div class="hint">👆 拖曳旋轉 3D 宮廟｜滑輪縮放｜點擊地面累積香火</div></div><script>const S={money:500,faith:100,believers:12,front:false,main:false,back:false,tower:false,god:'土地公'};const gods=[['土地公','守護地方','🧓'],['媽祖','平安','👩‍🦳'],['文昌帝君','學業','📚'],['財神爺','財運','💰'],['關聖帝君','事業','⚔️'],['月老','姻緣','💗'],['城隍爺','秩序','🧔'],['三太子','青春','🧒']];try{Object.assign(S,JSON.parse(localStorage.getItem('shenming3d')||'{}'))}catch(e){}function save(){localStorage.setItem('shenming3d',JSON.stringify(S))}function render(){money.textContent=Math.floor(S.money);faith.textContent=Math.floor(S.faith);believers.textContent=Math.floor(S.believers)}function toast(x){t.innerHTML=x;t.style.display='block';clearTimeout(window.tm);tm=setTimeout(()=>t.style.display='none',1800)}function panel(type){p.style.display='block';if(type==='god')p.innerHTML='<h2>🙏 神明安座</h2><div class="card">目前主神：<b>'+S.god+'</b><br>擲筊迎請 Q版神明</div>'+gods.map((g,i)=>'<div class="card"><b>'+g[2]+' '+g[0]+'</b>｜'+g[1]+'<br><button onclick="worship(\''+g[0]+'\')">擲筊迎請 '+(80+i*30)+'🪙</button></div>').join('')+'<button onclick="p.style.display=\'none\'">關閉</button>';if(type==='build')p.innerHTML='<h2>🏯 3D 宮廟擴建</h2><div class="card">前殿：'+(S.front?'完成':'未完成')+'<br>正殿：'+(S.main?'完成':'未完成')+'<br>後殿：'+(S.back?'完成':'未完成')+'<br>鐘鼓樓：'+(S.tower?'完成':'未完成')+'</div><button onclick="build(\'front\',800)">三川殿 800🪙</button><br><br><button onclick="build(\'main\',1500)">正殿 1500🪙</button><br><br><button onclick="build(\'back\',2400)">後殿 2400🪙</button><br><br><button onclick="build(\'tower\',3600)">鐘樓・鼓樓 3600🪙</button><div class="card">3D古建細節：燕尾脊、蟠龍石柱、青斗石獅、手工剪黏。</div><button onclick="p.style.display=\'none\'">關閉</button>';if(type==='formation')p.innerHTML='<h2>🥁 百萬藝陣</h2><div class="card">八家將 👹｜官將首 🎭｜電音三太子 🕺｜舞龍舞獅 🐲</div><button onclick="parade()">🌈 霓虹夜巡 -50✨</button><br><br><button onclick="challenge()">🥁 同行踢館</button><br><br><button onclick="p.style.display=\'none\'">關閉</button>'}function worship(g){let i=gods.findIndex(x=>x[0]===g),cost=80+i*30;if(S.money<cost)return toast('香油錢不足！');S.money-=cost;S.god=g;if(Math.random()<.65){S.money+=220;S.faith+=90;S.believers+=2;toast('🧧 '+g+' 顯靈！ +220 香油錢')}else toast('🌓 再擲一次筊吧！');render();save();panel('god')}function build(k,c){if(S[k])return toast('已完成！');if(S.money<c)return toast('香油錢不足！');S.money-=c;S[k]=true;S.faith+=40;render();save();toast('🏯 3D 宮廟擴建完成！');panel('build')}function parade(){if(S.faith<50)return toast('信仰之力不足！');S.faith-=50;S.money+=650;S.believers+=10;render();save();toast('🌈 霓虹夜巡完成！')}function challenge(){if(Math.random()<.6){S.money+=500;S.faith+=70;toast('🥁 鬥陣圓滿！')}else{S.money=Math.max(0,S.money-180);toast('陣勢受挫，-180🪙')}render();save()}const gl=c.getContext('webgl',{antialias:true});let yaw=.55,pitch=.55,dist=15,lastX,lastY,drag=false;function sh(t,s){let x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);return x}const vs=sh(gl.VERTEX_SHADER,'attribute vec3 p;uniform mat4 mvp;varying vec3 v;void main(){v=p;gl_Position=mvp*vec4(p,1.);}'),fs=sh(gl.FRAGMENT_SHADER,'precision mediump float;uniform vec3 col;varying vec3 v;void main(){float l=.72+.28*max(0.0,v.y);gl_FragColor=vec4(col*l,1.);}');const pr=gl.createProgram();gl.attachShader(pr,vs);gl.attachShader(pr,fs);gl.linkProgram(pr);gl.useProgram(pr);const locP=gl.getAttribLocation(pr,'p'),locM=gl.getUniformLocation(pr,'mvp'),locC=gl.getUniformLocation(pr,'col');let V=gl.createBuffer();function cube(x,y,z,w,h,d,col){let X=w/2,Y=h/2,Z=d/2,a=[x-X,y-Y,z-Z,x+X,y-Y,z-Z,x+X,y+Y,z-Z,x-X,y+Y,z-Z,x-X,y-Y,z+Z,x+X,y-Y,z+Z,x+X,y+Y,z+Z,x-X,y+Y,z+Z],idx=[0,1,2,0,2,3,4,6,5,4,7,6,0,4,5,0,5,1,2,6,7,2,7,3,0,3,7,0,7,4,1,5,6,1,6,2],out=[];for(let i of idx)out.push(...a.slice(i*3,i*3+3));gl.bindBuffer(gl.ARRAY_BUFFER,V);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(out),gl.DYNAMIC_DRAW);gl.vertexAttribPointer(locP,3,gl.FLOAT,false,0,0);gl.enableVertexAttribArray(locP);gl.uniform3fv(locC,col);gl.drawArrays(gl.TRIANGLES,0,out.length/3)}function mat(){let asp=c.width/c.height,f=1.2;let m=new Float32Array(16);m[0]=f/asp;m[5]=f;m[10]=-1;m[11]=-1;m[14]=-2*dist;m[15]=1;return m}function draw(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;gl.viewport(0,0,c.width,c.height);gl.clearColor(.35,.63,.73,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.enable(gl.DEPTH_TEST);gl.useProgram(pr);gl.uniformMatrix4fv(locM,false,mat());cube(0,-.25,0,18,.5,14,[.55,.48,.34]);cube(0,0,0,6,.2,10,[.62,.58,.5]);cube(0,1,0,5.8,2,3.5,[.65,.16,.12]);if(S.front)cube(0,1.6,-2.7,6.6,1.6,2,[.72,.2,.14]);if(S.main)cube(0,2,0,6.2,2.2,3.8,[.72,.2,.14]);if(S.back)cube(0,1.8,2.8,5.8,1.8,2.2,[.72,.2,.14]);cube(0,2.9,0,7,.35,4.5,[.25,.18,.13]);if(S.tower){cube(-4,1,-1,1.8,3,1.8,[.45,.28,.16]);cube(4,1,-1,1.8,3,1.8,[.45,.28,.16])}cube(0,.75,-2,1.1,1.5,.5,[.15,.11,.08]);cube(0,1.5,-1.95,1.8,.35,.25,[.9,.68,.2]);for(let i=-3;i<=3;i+=2){cube(i,.7,4.8,.7,1.4,.7,[.32,.5,.28]);cube(i,1.65,4.8,1.8,.8,1.8,[.16,.42,.23])}requestAnimationFrame(draw)}c.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY});c.addEventListener('pointerup',()=>drag=false);c.addEventListener('pointermove',e=>{if(drag){yaw+=(e.clientX-lastX)*.008;pitch=Math.max(.15,Math.min(1.15,pitch+(e.clientY-lastY)*.006));lastX=e.clientX;lastY=e.clientY}});c.addEventListener('wheel',e=>{dist=Math.max(8,Math.min(24,dist+e.deltaY*.01))});c.addEventListener('click',e=>{if(Math.abs(e.clientX-lastX)<8){S.money+=35;S.faith+=10;S.believers++;render();save();toast('✨ 信徒祈福！ +35🪙 +10✨')}});render();draw();</script></body></html>
