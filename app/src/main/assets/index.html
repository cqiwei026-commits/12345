<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>神明請上工！</title>
<style>
*{box-sizing:border-box;touch-action:manipulation}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10151b;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#fff}
button{font:inherit}
#game{width:100vw;height:100vh;position:relative;overflow:hidden;background:linear-gradient(#8fc4dc 0 35%,#d7c59b 35% 100%)}
.sky{position:absolute;inset:0 0 65% 0;background:linear-gradient(#76b8d5,#cfe8e8)}
.cloud{position:absolute;background:#fff8;border-radius:50px;filter:blur(1px)}
.c1{width:180px;height:38px;top:9%;left:7%}.c2{width:220px;height:42px;top:17%;right:5%}
.town{position:absolute;left:0;right:0;top:28%;height:38%;background:#d9c89f}
.house{position:absolute;bottom:8%;width:19%;height:50%;background:#e8dfc9;border:4px solid #76685a;border-bottom:0}
.h1{left:3%}.h2{left:27%;height:58%}.h3{right:4%;height:55%}
.roof{position:absolute;left:-7%;top:-22%;width:114%;height:30%;background:#756454;transform:skewX(-25deg);border-top:7px solid #4e4439}
.window{position:absolute;width:28%;height:30%;left:36%;top:27%;background:#8db6c3;border:4px solid #655b4e}
.road{position:absolute;left:0;right:0;bottom:0;height:25%;background:#817e78}
.road:after{content:"";position:absolute;left:0;right:0;top:48%;border-top:7px dashed #ddd}
.tree{position:absolute;bottom:24%;width:80px;height:150px}
.tree:before{content:"";position:absolute;bottom:0;left:35px;width:13px;height:90px;background:#604b37}
.tree:after{content:"";position:absolute;top:0;left:0;width:80px;height:80px;background:#397451;border-radius:50%;box-shadow:35px 15px 0 #43835b,-30px 25px 0 #326747}
.t1{left:21%}.t2{right:20%}
.temple{position:absolute;left:50%;top:36%;transform:translateX(-50%);width:min(42vw,520px);height:33vh;min-height:230px;background:#b7352d;border:7px solid #713027;border-radius:8px;box-shadow:0 15px 35px #2228}
.temple .roofmain{position:absolute;left:-10%;top:-22%;width:120%;height:33%;background:#5d3f31;border:6px solid #3f3028;clip-path:polygon(0 100%,10% 35%,50% 0,90% 35%,100% 100%,86% 82%,50% 55%,14% 82%)}
.temple .ridge{position:absolute;left:18%;top:-13%;width:64%;height:10px;background:#d9b34d;border-radius:10px}
.temple .sign{position:absolute;top:18%;left:50%;transform:translateX(-50%);padding:6px 24px;background:#f1c84b;color:#60251d;border:4px solid #8b6123;font-size:clamp(16px,2vw,28px);font-weight:900;white-space:nowrap}
.columns{position:absolute;top:42%;left:8%;right:8%;height:48%;display:flex;justify-content:space-between}
.col{width:10px;background:#d5a34d;box-shadow:0 0 0 3px #8b532f}
.door{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:24%;height:46%;background:#49352c;border:5px solid #d1a149;border-radius:6px 6px 0 0}
.lion{position:absolute;bottom:0;width:14%;height:18%;background:#e0c45c;border-radius:50% 50% 35% 35%;border:3px solid #8d6429}
.lion.l{left:14%}.lion.r{right:14%}
.plaza{position:absolute;left:50%;transform:translateX(-50%);top:67%;width:48%;height:17%;background:#bdb4a1;border:5px solid #777066;border-radius:50%}
.player{position:absolute;left:49%;bottom:17%;font-size:44px;z-index:5;animation:bob 1s infinite alternate}
@keyframes bob{to{transform:translateY(-5px)}}
.hud{position:absolute;z-index:20;left:0;right:0;top:0;height:72px;background:#1c232bdd;border-bottom:3px solid #c79b3d;display:flex;align-items:center;gap:10px;padding:8px 12px}
.title{font-size:clamp(18px,2.2vw,28px);font-weight:900;color:#ffd75c;white-space:nowrap}
.res{background:#303943;border:2px solid #66727d;border-radius:12px;padding:8px 12px;min-width:105px;text-align:center;font-weight:800}
.menu{margin-left:auto;display:flex;gap:7px}
.menu button,.panel button{border:0;border-radius:10px;padding:9px 12px;background:#a94a35;color:white;font-weight:900}
#panel{position:absolute;z-index:30;right:12px;top:84px;width:min(360px,45vw);max-height:72vh;overflow:auto;background:#202832ee;border:3px solid #c79b3d;border-radius:16px;padding:14px;display:none}
#panel h2{margin:0 0 8px;color:#ffd75c}
.card{background:#313b46;border-radius:12px;padding:10px;margin:8px 0}
.big{font-size:32px}
.log{font-size:13px;color:#d9e0e5;line-height:1.45}
.toast{position:absolute;z-index:50;left:50%;top:78%;transform:translate(-50%,-50%);background:#241d18ee;border:3px solid #e1b94e;border-radius:14px;padding:14px 22px;font-weight:900;font-size:18px;display:none;text-align:center}
.help{position:absolute;z-index:10;left:14px;bottom:12px;background:#202832cc;border-radius:12px;padding:8px 12px;font-size:13px}
</style>
</head>
<body>
<div id="game">
  <div class="sky"><div class="cloud c1"></div><div class="cloud c2"></div></div>
  <div class="town">
    <div class="house h1"><div class="roof"></div><div class="window"></div></div>
    <div class="house h2"><div class="roof"></div><div class="window"></div></div>
    <div class="house h3"><div class="roof"></div><div class="window"></div></div>
    <div class="tree t1"></div><div class="tree t2"></div>
  </div>
  <div class="road"></div>
  <div class="plaza"></div>
  <div class="temple">
    <div class="roofmain"></div><div class="ridge"></div>
    <div class="sign">土地公廟</div>
    <div class="columns"><div class="col"></div><div class="col"></div><div class="col"></div><div class="col"></div></div>
    <div class="door"></div><div class="lion l"></div><div class="lion r"></div>
  </div>
  <div class="player">🧑‍💼</div>

  <div class="hud">
    <div class="title">🏮 神明請上工！</div>
    <div class="res">🪙 香油錢 <span id="money">500</span></div>
    <div class="res">✨ 信仰之力 <span id="faith">100</span></div>
    <div class="res">🙏 信徒 <span id="believers">12</span></div>
    <div class="menu">
      <button onclick="openPanel('god')">神明</button>
      <button onclick="openPanel('build')">擴建</button>
      <button onclick="openPanel('formation')">藝陣</button>
    </div>
  </div>

  <div id="panel"></div>
  <div id="toast" class="toast"></div>
  <div class="help">👆 點擊宮廟或信徒事件，累積香油錢與信仰之力</div>
</div>

<script>
const S={money:500,faith:100,believers:12,level:1,front:false,main:false,back:false,tower:false,led:false,god:'土地公',last:Date.now()};
const gods=[
 ['土地公','守護地方','🧓'],['媽祖','平安與航行','👩‍🦳'],['文昌帝君','學業考試','📚'],['財神爺','財運','💰'],['關聖帝君','事業與義氣','⚔️'],['月老','姻緣','💗'],['城隍爺','秩序守護','🧔'],['三太子','青春活力','🧒']
];
const save=()=>localStorage.setItem('shenming_save',JSON.stringify(S));
const load=()=>{try{Object.assign(S,JSON.parse(localStorage.getItem('shenming_save')||'{}'))}catch(e){};render()};
const fmt=n=>Math.floor(n);
function render(){money.textContent=fmt(S.money);faith.textContent=fmt(S.faith);believers.textContent=fmt(S.believers)}
function toast(t){const x=document.getElementById('toast');x.innerHTML=t;x.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>x.style.display='none',1800)}
function earn(m,f,b=0){S.money+=m;S.faith+=f;S.believers+=b;render();save();toast(`✨ 信仰回應！<br>+${m} 香油錢　+${f} 信仰之力`)}
function openPanel(type){
 const p=document.getElementById('panel');p.style.display='block';
 if(type==='god')p.innerHTML=`<h2>🙏 神明安座</h2><div class="card">目前主神：<b>${S.god}</b><br>透過擲筊迎請不同神明。</div>`+gods.map((g,i)=>`<div class="card"><span class="big">${g[2]}</span> <b>${g[0]}</b><br>${g[1]}<br><button onclick="worship('${g[0]}')">擲筊迎請（${80+i*30}🪙）</button></div>`).join('')+`<button onclick="closePanel()">關閉</button>`;
 if(type==='build')p.innerHTML=`<h2>🏯 宮廟三進擴建</h2>
 <div class="card">目前等級：${S.level}<br>前殿（三川殿）：${S.front?'已完成':'未完成'}<br>正殿：${S.main?'已完成':'未完成'}<br>後殿：${S.back?'已完成':'未完成'}<br>鐘鼓樓：${S.tower?'已完成':'未完成'}</div>
 <button onclick="build('front',800)">建造前殿（三川殿） 800🪙</button><br><br>
 <button onclick="build('main',1500)">擴建正殿 1500🪙</button><br><br>
 <button onclick="build('back',2400)">擴建後殿 2400🪙</button><br><br>
 <button onclick="build('tower',3600)">興建鐘樓・鼓樓 3600🪙</button><br><br>
 <div class="card">古建客製：燕尾脊、蟠龍石柱、青斗石獅、手工剪黏（第一版先展示系統入口）</div>
 <button onclick="closePanel()">關閉</button>`;
 if(type==='formation')p.innerHTML=`<h2>🥁 百萬藝陣</h2>
 <div class="card">八家將　👹<br>官將首　🎭<br>電音三太子　🕺<br>舞龍舞獅　🐲</div>
 <div class="card">裝備：LED螢光神轎、霓虹大鑼、螢光羽扇</div>
 <button onclick="parade()">🌈 霓虹夜巡（消耗 50 信仰）</button><br><br>
 <button onclick="challenge()">🥁 同行踢館（隨機事件）</button><br><br>
 <button onclick="closePanel()">關閉</button>`;
}
function closePanel(){document.getElementById('panel').style.display='none'}
function worship(g){
 const cost=80+gods.findIndex(x=>x[0]===g)*30;
 if(S.money<cost){toast('香油錢不足！');return}
 S.money-=cost;
 const good=Math.random()<.65;
 S.god=g;
 if(good){S.faith+=90;S.believers+=2;S.money+=220;toast(`🧧 擲筊成功！<br>${g} 顯靈，+220 香油錢`)}
 else toast('🌓 聖筊未成，再試一次吧！');
 render();save();openPanel('god');
}
function build(k,cost){
 if(S[k]){toast('已經完成了！');return}
 if(S.money<cost){toast('香油錢不足！');return}
 S.money-=cost;S[k]=true;S.level++;S.faith+=40;render();save();toast('🏯 擴建完成！宮廟更氣派了！');openPanel('build');
}
function parade(){
 if(S.faith<50){toast('信仰之力不足！');return}
 S.faith-=50;S.money+=650;S.believers+=10;render();save();toast('🌈 霓虹夜巡完成！<br>全台香火受到吸引！');
}
function challenge(){
 const win=Math.random()<.6;
 if(win){S.money+=500;S.faith+=70;toast('🥁 鬥陣圓滿！<br>鄰庄香客也來參拜了！')}
 else {S.money=Math.max(0,S.money-180);toast('😵‍💫 對方陣勢太猛，損失 180 香油錢。')}
 render();save();
}
document.getElementById('game').addEventListener('click',e=>{
 if(e.target.closest('button')||e.target.closest('#panel'))return;
 const r=Math.random();
 if(r<.25){S.believers++;earn(35,10,0)}
 else if(r<.5){earn(70,18,0)}
 else {earn(110,25,1)}
});
load();
setInterval(()=>{S.money+=Math.max(1,Math.floor(S.believers/8));S.faith+=1;render();save()},5000);
</script>
</body>
</html>
